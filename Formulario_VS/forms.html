<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="container">

    <h1>Formulário</h1>

    <form action="fteste" class="formulario">

        <div class="campo">
            <label>RA:</label>
            <input type="text" name="txtra" placeholder="RA">
        </div>

        <div class="campo">
            <label>Nome:</label>
            <input type="text" name="txtnome" placeholder="Nome">
        </div>

        <div class="campo">
            <label>Idade:</label>
            <input type="number" name="txt_idade" min="10" max="20" step="1">
        </div>

        <div class="campo">
            <label>Senha:</label>
            <input type="password" name="txt_senha">
        </div>

        <div class="campo">
            <label>Celular:</label>
            <input type="tel" name="txt_celular">
        </div>

        <div class="campo">
            <label>Email:</label>
            <input type="email" name="txt_email">
        </div>

        <div class="campo">
            <label>Site:</label>
            <input type="url" name="txt_site">
        </div>

        <div class="campo">
            <label>Data:</label>
            <input type="date" name="txt_data">
        </div>

        <div class="campo">
            <label>Linguagens:</label><br>
            <input type="checkbox" name="php"> PHP
            <input type="checkbox" name="java"> Java
            <input type="checkbox" name="c"> C
        </div>

        <div class="campo">
            <label>Cor Preferida:</label><br>
            <input type="radio" name="cor" value="azul"> Azul
            <input type="radio" name="cor" value="rosa"> Rosa
            <input type="radio" name="cor" value="amarelo"> Amarelo
        </div>

        <div class="campo">
            <label>Estado:</label>
            <select name="estado">
                <optgroup label="Sudeste">
                    <option>Rio de Janeiro</option>
                    <option>São Paulo</option>
                    <option>Espírito Santo</option>
                </optgroup>
                <optgroup label="Sul">
                    <option>Santa Catarina</option>
                    <option>Paraná</option>
                </optgroup>
            </select>
        </div>

        <div class="botoes">
            <input type="reset" value="Apagar">
            <input type="submit" value="Salvar">
        </div>

    </form>

</div>
 
</body>
</html>
